name: Deploy Cloudflare Worker

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cloudflare/worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build deployment config without logging values
        run: |
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8"));
            config.kv_namespaces[0].id = process.env.CLOUDFLARE_KV_NAMESPACE_ID;
            config.vars.ALLOWED_ORIGINS = process.env.ALLOWED_ORIGINS;
            fs.writeFileSync(".wrangler-deploy.jsonc", JSON.stringify(config));
          '
      - run: npx wrangler deploy --config .wrangler-deploy.jsonc --keep-vars
