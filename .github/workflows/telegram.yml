name: Telegram notification

on:
  schedule:
    # 09:00-11:45 Asia/Ho_Chi_Minh (UTC+7).
    - cron: "0-45/15 2-4 * * *"
    # Final 12:00 catch-up in Asia/Ho_Chi_Minh (UTC+7).
    - cron: "0 5 * * *"
  workflow_run:
    workflows: ["Data sync and Pages deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Notification mode
        required: true
        default: daily
        type: choice
        options: [daily, manual]
      request_id:
        description: Optional UUID for a manual operation
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages-publication
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'develop' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
      NOTIFICATION_LEDGER_HMAC_KEY: ${{ secrets.NOTIFICATION_LEDGER_HMAC_KEY }}
      NOTIFICATION_DRY_RUN: ${{ vars.NOTIFICATION_DRY_RUN || 'true' }}
      GITHUB_JOB_TIMEOUT_SECONDS: "900"
      EVENT_NAME: ${{ github.event_name }}
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: develop
          path: source
      - name: Check out publication workspace
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          path: publication
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements-cloud.txt
      - run: pip install -r source/requirements-cloud.txt
      - name: Load publication branch
        shell: bash
        run: |
          if git -C publication fetch origin gh-pages:refs/remotes/origin/gh-pages; then
            git -C publication checkout -B gh-pages refs/remotes/origin/gh-pages
          else
            git -C publication checkout --orphan gh-pages
            git -C publication rm -rf .
          fi
          git -C publication config user.name "github-actions[bot]"
          git -C publication config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run bounded Telegram job
        id: notify
        continue-on-error: true
        shell: bash
        run: |
          case "$EVENT_NAME" in
            schedule)
              mode="daily"
              ;;
            workflow_run)
              mode="data-failure"
              ;;
            workflow_dispatch)
              mode="${INPUT_MODE:-daily}"
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME"
              exit 1
              ;;
          esac

          request_id=""
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            request_id="$INPUT_REQUEST_ID"
          fi

          args=(telegram --mode "$mode")
          if [[ "$mode" == "manual" ]]; then
            if [[ -z "$request_id" ]]; then
              request_id="$(python -c 'import uuid; print(uuid.uuid4())')"
            fi
            args+=(--request-id "$request_id")
          fi
          python source/scripts/cloud_job.py "${args[@]}" --store-root publication
      - name: Verify publication and capture bounded state change
        id: capture
        shell: bash
        run: |
          python source/scripts/verify_cloud_contracts.py --publication-root publication
          change_root="$(mktemp -d "$RUNNER_TEMP/state-change.XXXXXX")"
          mkdir -p publication/state "$change_root"
          cp -a publication/state "$change_root/state"
          echo "path=$change_root" >> "$GITHUB_OUTPUT"
      - name: Push Telegram state safely
        shell: bash
        env:
          CHANGE_ROOT: ${{ steps.capture.outputs.path }}
        run: |
          published=false
          for attempt in 1 2 3; do
            if git -C publication fetch origin gh-pages:refs/remotes/origin/gh-pages; then
              git -C publication reset --hard refs/remotes/origin/gh-pages
              git -C publication clean -fd
            fi

            rm -rf publication/state
            cp -a "$CHANGE_ROOT/state" publication/state
            python source/scripts/verify_cloud_contracts.py --publication-root publication
            git -C publication add state
            if ! git -C publication diff --cached --quiet; then
              git -C publication commit -m "telegram: persist delivery state"
            fi

            if git -C publication show-ref --verify --quiet refs/remotes/origin/gh-pages && \
              git -C publication diff --quiet refs/remotes/origin/gh-pages HEAD; then
              published=true
              break
            fi
            if git -C publication push origin HEAD:gh-pages; then
              published=true
              break
            fi
            echo "Publication changed remotely; retrying attempt $attempt of 3"
          done
          test "$published" = true
      - name: Report Telegram job failure after safe state publication
        if: steps.notify.outcome != 'success'
        run: |
          echo "Telegram delivery was incomplete; persisted delivery state for a safe retry."
          exit 1
